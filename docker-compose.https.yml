# VPS com HTTPS automatico (Let's Encrypt) via Caddy.
# Requisitos: DOMAIN no .env apontando (registro DNS A/AAAA) para o IP da VPS, portas 80 e 443 liberadas.
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build

services:
  frontend:
    # O front deixa de publicar porta: so o Caddy recebe trafego externo
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env para usar HTTPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
